[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

[tool.coverage.run]
source = ["draft_engine"]
# CLI and web server are thin entrypoints; core engine coverage is the
# meaningful signal for this project.
omit = [
    "draft_engine/__main__.py",
    "draft_engine/cli.py",
    "draft_engine/server.py",
]
